
name: Build Rosa Reader APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verificar arquivos do projeto
        run: |
          echo "Arquivos presentes no repositório:"
          ls -la
          echo "ZIPs encontrados:"
          find . -maxdepth 3 -type f -iname "*.zip"

      - name: Extrair projeto
        run: |
          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ERRO: nenhum ZIP encontrado."
            exit 1
          fi
          mkdir projeto
          unzip -q "$ZIP" -d projeto
          echo "Conteúdo extraído:"
          find projeto -maxdepth 3 -type f | head -n 80
          
